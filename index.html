<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoSec-Ware // Secure Terminal</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent-green: #2ea44f;
            --accent-red: #da3633;
            --accent-blue: #58a6ff;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            background-color: var(--accent-green);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 700px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 400px;
        }

        .panel h3 {
            margin-top: 0;
            font-size: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .log-area {
            flex: 1;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-entry {
            word-break: break-all;
        }

        .log-entry.system { color: var(--accent-blue); }
        .log-entry.success { color: var(--accent-green); }
        .log-entry.hack { color: var(--accent-red); }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #000;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-family: var(--font-mono);
        }

        button {
            background-color: var(--border-color);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-weight: bold;
        }

        button:hover {
            opacity: 0.8;
        }

        button.btn-hack {
            background-color: var(--accent-red);
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h2 style="margin:0;">NoSec-Ware v1.0</h2>
            <small style="color: #8b949e;">Ende-zu-Ende Verschlüsselung & Metadaten-Schutz</small>
        </div>
        <span class="status-badge" id="statusBadge">PROTECTED</span>
    </header>

    <div class="main-grid">
        <!-- Client Chat Terminal -->
        <div class="panel">
            <h3>Gesicherter Client Terminal</h3>
            <div class="log-area" id="chatLog">
                <div class="log-entry system">[SYSTEM] NoSec-Ware Tunnel initialisiert.</div>
                <div class="log-entry system">[SYSTEM] Schlüssel ausgetauscht (Curve25519).</div>
            </div>
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="Nachricht eingeben..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Senden</button>
            </div>
        </div>

        <!-- Network / Hacker Terminal -->
        <div class="panel">
            <h3>Netzwerk-Abhörstelle (MiTM)</h3>
            <div class="log-area" id="hackLog">
                <div class="log-entry system">[SNIFFER] Lausche auf Port 443 / NoSec-Relay...</div>
            </div>
            <button class="btn-hack" onclick="simulateHack()">Hacking-Versuch starten</button>
        </div>
    </div>
</div>

<script>
    // Einfache Demonstration für die Verschlüsselung (Simulierter AES-GCM + Base64)
    function fakeEncrypt(text) {
        const dummyPadding = "PADDING_NOP_389274923847239847239847293874";
        const combined = text + "::" + dummyPadding;
        return btoa(unescape(encodeURIComponent(combined))).split('').reverse().join('');
    }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        const chatLog = document.getElementById('chatLog');
        const hackLog = document.getElementById('hackLog');

        // Local Display
        chatLog.innerHTML += `<div class="log-entry"><strong>Du:</strong> ${text}</div>`;
        
        // Encryption Process
        const encrypted = fakeEncrypt(text);

        // Network Capture (Simulation)
        hackLog.innerHTML += `<div class="log-entry hack">[ABGEFANGEN] Paketgröße: ${encrypted.length} Bytes<br>Inhalt: ${encrypted}</div>`;

        input.value = '';
        chatLog.scrollTop = chatLog.scrollHeight;
        hackLog.scrollTop = hackLog.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function simulateHack() {
        const hackLog = document.getElementById('hackLog');
        const statusBadge = document.getElementById('statusBadge');
        
        hackLog.innerHTML += `<div class="log-entry hack">----------------------------------</div>`;
        hackLog.innerHTML += `<div class="log-entry hack">[ANGRIFF] Versuche Brute-Force Entschlüsselung...</div>`;

        setTimeout(() => {
            hackLog.innerHTML += `<div class="log-entry hack">[FEHLER] Schlüssel nicht im Arbeitsspeicher gefunden (Zero-Knowledge).</div>`;
            hackLog.innerHTML += `<div class="log-entry hack">[STATUS] Pakete sind durch Padding unlesbar (NoSec-OEC aktiv).</div>`;
            hackLog.scrollTop = hackLog.scrollHeight;
        }, 1200);
    }
</script>

</body>
</html>
